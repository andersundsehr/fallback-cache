name: PHP Composer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: [ '82', '83', '84', '85' ]
        typo3: [ '13', '14' ]
    container:
      image: ghcr.io/typo3/core-testing-php${{ matrix.php }}:latest
    steps:
      - name: Install Node.js (Alpine)
        run: apk add --no-cache nodejs npm
      - uses: actions/checkout@v4
      - name: Get composer project name
        id: composer-name
        run: echo "name=$(php -r "echo str_replace('/', '-', json_decode(file_get_contents('composer.json'))->name);")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
            node_modules
          key: ${{ matrix.typo3 }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ matrix.typo3 }}-${{ matrix.php }}-composer-
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --sort-packages --no-interaction
      - run: composer update --no-interaction --with typo3/minimal:^${{ matrix.typo3 }}.0.0 --with typo3/cms-core:^${{ matrix.typo3 }}.0.0
      - run: bash tests/typo3-svg-sanitizer.sh
      - run: ./vendor/bin/grumphp run --ansi --no-interaction
      - run: composer test
