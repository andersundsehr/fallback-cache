name: PHP Composer

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        php: [ '82', '83', '84', '85', '86' ]
        typo3: [ '13', '14' ]
        include:
          # phpro/grumphp does not allow PHP 8.6 yet
          - php: '86'
            ignorePlatformReqs: '--ignore-platform-req=php+'
    container:
      image: ghcr.io/typo3/core-testing-php${{ matrix.php }}:latest
    steps:
      - name: Install Node.js (Alpine)
        run: apk add --no-cache nodejs npm
      - uses: actions/checkout@v4
      - name: Get composer project name
        id: composer-name
        run: echo "name=$(php -r "echo str_replace('/', '-', json_decode(file_get_contents('composer.json'))->name);")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
            node_modules
          key: ${{ matrix.typo3 }}-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ matrix.typo3 }}-${{ matrix.php }}-composer-
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      # the composer audit task of GrumPHP runs with --locked and needs a composer.lock
      - run: composer config lock true
      - run: composer update --no-interaction --with typo3/minimal:^${{ matrix.typo3 }}.0.0 --with typo3/cms-core:^${{ matrix.typo3 }}.0.0 ${{ matrix.ignorePlatformReqs }}
      # --ignore-platform-req=php+ may only skip the PHP check of dev dependencies (e.g. phpro/grumphp)
      - if: matrix.php == '86'
        run: composer check-platform-reqs --no-dev
      - run: ./vendor/bin/grumphp run --ansi --no-interaction
      - run: composer test
